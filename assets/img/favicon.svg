<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0620"/>
      <stop offset="50%" stop-color="#140a38"/>
      <stop offset="100%" stop-color="#05010f"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Text Monogram Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#b197fc"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="3" filter="drop-shadow(0 10px 20px rgba(139, 92, 246, 0.4))"/>

  <!-- Subtle Inner Ambient Highlight -->
  <circle cx="34" cy="34" r="28" fill="#8b5cf6" opacity="0.18" filter="blur(12px)"/>
  <circle cx="94" cy="94" r="24" fill="#38bdf8" opacity="0.15" filter="blur(12px)"/>

  <!-- SP Monogram -->
  <g filter="url(#glow)">
    <text x="64" y="80" 
          font-family="'Sora', 'Inter', -apple-system, sans-serif" 
          font-size="52" 
          font-weight="900" 
          letter-spacing="-2px"
          text-anchor="middle" 
          fill="url(#text-grad)">
      SP
    </text>
  </g>

  <!-- Accent Status Dot (Active / Live) -->
  <circle cx="98" cy="32" r="5" fill="#34d399" filter="drop-shadow(0 0 6px #34d399)"/>
</svg>
